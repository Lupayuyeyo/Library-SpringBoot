<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Daftar Buku</title>
</head>
<body>
<nav>
    <a th:href="@{/buku}">Buku</a> |
    <a th:href="@{/anggota}">Anggota</a>
</nav>

<h1>Daftar Buku</h1>
<p th:if="${error}" th:text="${error}" style="color: red;"></p>

<form th:action="@{/buku}" method="get">
    <input name="kata" th:value="${kata}" placeholder="Cari judul buku">
    <button type="submit">Cari</button>
    <a th:href="@{/buku}">Reset</a>
</form>

<table border="1" cellpadding="8">
    <thead>
    <tr><th>ID</th><th>Judul</th><th>Stok</th></tr>
    </thead>
    <tbody>
    <tr th:each="b : ${daftarBuku}">
        <td th:text="${b.idBuku}">B001</td>
        <td th:text="${b.judul}">Judul buku</td>
        <td th:text="${b.stok}">0</td>
    </tr>
    <tr th:if="${#lists.isEmpty(daftarBuku)}">
        <td colspan="3">Buku tidak ditemukan.</td>
    </tr>
    </tbody>
</table>

<h2>Tambah Buku</h2>
<form th:action="@{/buku}" method="post">
    <p><label>ID Buku: <input name="idBuku" maxlength="10" required></label></p>
    <p><label>Judul: <input name="judul" maxlength="200" required></label></p>
    <p><label>Stok: <input name="stok" type="number" min="0" value="1" required></label></p>
    <button type="submit">Simpan Buku</button>
</form>
</body>
</html>
